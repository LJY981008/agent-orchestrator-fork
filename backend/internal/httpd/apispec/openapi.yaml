          - slot_project
          - slot_workers
          - memory_tight
          - disk_low
          - paths_overlap
          - issue_unreadable
          - retry
          - lado_mode_off
          - run_live
          - verifying
          - checks_pending
          - checks_failed
          - commands_running
          - worktree_not_at_head
          - worktree_changed
          - head_unavailable
          - commands_failed
          - command_timed_out
          - worktree_missing
          - commit_messages_failed
          - protected_path
          - review_pending
          - changes_requested
          - status_not_posted
          - merged_without_approval
          type: string
