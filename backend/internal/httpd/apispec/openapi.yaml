          description: 'Derived task state. review_required: the plan needs a new
            approval; blocked: the plan or the setup must change first; queued: the
            approved plan waits for the dispatcher; dispatching: LADO starts its worker;
            running: the worker session lives without a PR; validating: LADO verifies
            the open PR''s current head, and stateReason says what it waits for or
            what fails; integration_pending: the head passed, or needs confirming,
            and waits for the developer''s integration approval; integrating: the
            head''s integration is approved; failed: the worker did not start, timed
            out or ended without a PR; completed: the PR merged; closed_unmerged:
            the PR or the issue closed without a merge. approved is no longer sent.'
          enum:
          - draft
          - planned
