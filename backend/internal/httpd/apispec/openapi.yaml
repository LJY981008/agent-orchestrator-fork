      - agents
  /api/v1/agents/codex/accounts/{accountId}:
    delete:
      operationId: deleteCodexAccount
      parameters:
      - description: AO Codex account identifier.
        in: path
        name: accountId
        required: true
        schema:
          description: AO Codex account identifier.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexAccountsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Service Unavailable
      summary: Delete one inactive signed-out Codex account
      tags:
      - agents
