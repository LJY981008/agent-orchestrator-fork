      - holdOnMemoryTight
      type: object
    UpdateLadoProjectSettingsRequest:
      properties:
        checkCommands:
          description: Replace the check commands, 0 to 10. A change needs a human-presence
            proof, because the daemon runs them outside any agent sandbox, and checkCommandsBase;
            an invalid list refuses with LADO_CHECK_COMMANDS_INVALID and its index,
            field and reason (a command with a control character, such as a line break,
            or a bidirectional control also with its position and the character as
            U+XXXX); a list that moved on since checkCommandsBase refuses with 409
            LADO_CHECK_COMMANDS_CHANGED and the current checkCommandsSha256.
          items:
            $ref: '#/components/schemas/LadoCheckCommandBody'
          maxItems: 10
          type:
          - "null"
          - array
        checkCommandsBase:
          description: The checkCommandsSha256 of the list the change starts from;
            a change of checkCommands needs it.
          type: string
        checkTimeoutMinutes:
          description: Each check command's time limit in minutes. It changes without
            a presence proof.
          maximum: 120
          minimum: 5
          type:
          - "null"
          - integer
        ladoMode:
          description: Put the project's workers under LADO's worker gate. Turning
            it on refuses while tracker intake is on; turning it off needs a human-presence
            proof, and queued work then waits while running workers go on.
          type:
          - "null"
          - boolean
        maxConcurrent:
          description: How many executions run at once in the project. It changes
            without a presence proof.
          maximum: 8
          minimum: 1
          type:
          - "null"
          - integer
        overlapIgnore:
          description: Replace the globs whose overlap does not hold work back; an
            invalid glob refuses with LADO_OVERLAP_IGNORE_INVALID. It changes without
            a presence proof.
          items:
            type: string
          maxItems: 50
          type:
          - "null"
          - array
        overlapIgnoreDefaults:
          description: Go back to LADO's default list of globs whose overlap does
            not count.
          type: boolean
        overlapWait:
          description: Hold a task while a live run of another task of the project
            may touch the same files. It changes without a presence proof.
          type:
          - "null"
          - boolean
      type: object
