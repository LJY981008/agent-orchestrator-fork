    TriggerReviewRequest:
      properties:
        agentConfig:
          $ref: '#/components/schemas/AgentConfig'
        enableAutoInject:
          description: Turn on the worker session's review auto-inject once a pass
            has started, so the reviewer's PR review comments reach the worker.
          type: boolean
        harness:
          enum:
          - claude-code
          - codex
          - copilot
          - cursor
          - kilocode
          - opencode
          - opencode-v2
          - kiro
          - pi
          - agy
          - devin
          - droid
          - kimi
          - kimchi
          - muse
          - amp
          - aider
          - grok
          - crush
          - auggie
          - cline
          - autohand
          type: string
        interfaceMode:
          enum:
          - chat
          - tui
          type: string
        prUrl:
          description: Restrict the pass to this pull request, attaching it to the
            session first if AO does not track it yet (never from another active session).
            Omit to review every eligible PR on the session.
          type: string
        rejectReviewedHead:
          description: Return 409 instead of reusing when every open PR head is already
            being reviewed or already has a review.
          type: boolean
        rerun:
          description: Start a fresh pass for already-reviewed current heads; a different
            reviewer may run alongside one that is still running. A person's rerun
            reuses an active pass from the same reviewer; an agent's rerun returns
            409 REVIEW_ALREADY_RUNNING instead.
          type: boolean
        source:
          description: 'Who requested the pass: manual (a person, the default) or
            agent (an AO session through the CLI).'
          enum:
          - manual
          - agent
          type: string
      type: object
    TriggerReviewResponse:
      properties:
        autoInjectEnabled:
          description: True when this request turned the worker session's review auto-inject
            on.
          type: boolean
        created:
          description: True when a new review pass was started; false when an existing
            run for the same commit was reused.
          type: boolean
        reviewerHandleId:
          type: string
        reviewerSurface:
          $ref: '#/components/schemas/DomainReviewerSurface'
        reviews:
          items:
            $ref: '#/components/schemas/PRReviewState'
          type: array
        runs:
          items:
            $ref: '#/components/schemas/ReviewRun'
          type: array
      required:
      - reviewerHandleId
      - reviews
      - runs
      - created
      - autoInjectEnabled
      type: object
