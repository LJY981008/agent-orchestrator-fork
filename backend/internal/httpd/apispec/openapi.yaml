openapi: 3.1.0
info:
  description: Loopback-only HTTP surface served by the Go daemon. Generated from
    Go (code-first) — do not edit by hand; run `go generate ./...`.
  title: Agent Orchestrator HTTP daemon
  version: 0.1.0-route-shell
servers:
- description: Local daemon (loopback only)
  url: http://127.0.0.1:3001
paths:
  /api/v1/agents:
    get:
      operationId: listAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Return cached supported and locally installed agent adapters
      tags:
      - agents
  /api/v1/agents/{agent}/auth:
    post:
      operationId: startAgentAuth
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAgentAuthResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Open the fixed native authentication flow for one agent
      tags:
      - agents
  /api/v1/agents/{agent}/install:
    get:
      operationId: getAgentInstallStatus
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallJob'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Get the current or last install job for one agent harness
      tags:
      - agents
    post:
      operationId: startAgentInstall
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentInstallRequest'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallJob'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Start an asynchronous install, reinstall, or update for one fixed agent
        harness
      tags:
      - agents
  /api/v1/agents/{agent}/logout:
    post:
      operationId: logoutAgent
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAgentAuthResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Open the fixed native logout flow for one agent
      tags:
      - agents
  /api/v1/agents/{agent}/models:
    get:
      operationId: getAgentModels
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      - description: Return catalog facts without reading session history for model
          recency. Cached catalogs are served while discovery refreshes in the background.
        in: query
        name: catalogOnly
        schema:
          description: Return catalog facts without reading session history for model
            recency. Cached catalogs are served while discovery refreshes in the background.
          type: boolean
      - description: Optional project identifier used as the model-catalog cache scope.
        in: query
        name: projectId
        schema:
          description: Optional project identifier used as the model-catalog cache
            scope.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Return the cached model picker for one agent, discovering it on first
        use
      tags:
      - agents
  /api/v1/agents/{agent}/models/refresh:
    post:
      operationId: refreshAgentModels
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      - description: Refresh the Harness Settings browsing catalog without session-history
          enrichment; FX includes all connections in a separate cache.
        in: query
        name: catalogOnly
        schema:
          description: Refresh the Harness Settings browsing catalog without session-history
            enrichment; FX includes all connections in a separate cache.
          type: boolean
      - description: Optional project identifier used as the model-catalog cache scope.
        in: query
        name: projectId
        schema:
          description: Optional project identifier used as the model-catalog cache
            scope.
          type: string
      - description: When true, compare executable and config metadata before running
          discovery.
        in: query
        name: revalidate
        schema:
          description: When true, compare executable and config metadata before running
            discovery.
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentModelsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Refresh and cache the model picker for one agent
      tags:
      - agents
  /api/v1/agents/{agent}/probe:
    post:
      operationId: probeAgent
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeAgentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Ensure launch-fresh readiness for one agent adapter
      tags:
      - agents
  /api/v1/agents/{agent}/update-advisory:
    get:
      operationId: getAgentUpdateAdvisory
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      - description: Re-probe the installed binary, ownership and latest release instead
          of reusing cached advisory evidence.
        in: query
        name: refresh
        schema:
          description: Re-probe the installed binary, ownership and latest release
            instead of reusing cached advisory evidence.
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentUpdateAdvisory'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Compare an installed harness version with its known package source
      tags:
      - agents
  /api/v1/agents/{agent}/verify:
    post:
      operationId: verifyAgentInstall
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallJob'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Verify an installed harness without reinstalling or probing authentication
      tags:
      - agents
  /api/v1/agents/accounts:
    get:
      operationId: listAgentAccounts
      parameters:
      - description: Read identity and limits again even when the last reading is
          fresh.
        in: query
        name: refresh
        schema:
          description: Read identity and limits again even when the last reading is
            fresh.
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccountsResponse'
          description: OK
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: List Claude Code and Codex accounts with their limits
      tags:
      - agents
  /api/v1/agents/accounts/{accountId}:
    delete:
      operationId: removeAgentAccount
      parameters:
      - description: Agent account identifier; device-claude and device-codex are
          this computer's own logins.
        in: path
        name: accountId
        required: true
        schema:
          description: Agent account identifier; device-claude and device-codex are
            this computer's own logins.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccountsResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Conflict
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Sign an account out and remove it
      tags:
      - agents
  /api/v1/agents/accounts/{accountId}/default:
    post:
      operationId: setDefaultAgentAccount
      parameters:
      - description: Agent account identifier; device-claude and device-codex are
          this computer's own logins.
        in: path
        name: accountId
        required: true
        schema:
          description: Agent account identifier; device-claude and device-codex are
            this computer's own logins.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccountsResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Make an account the default for new sessions of its provider
      tags:
      - agents
  /api/v1/agents/accounts/{accountId}/login:
    post:
      operationId: signInAgentAccountAgain
      parameters:
      - description: Agent account identifier; device-claude and device-codex are
          this computer's own logins.
        in: path
        name: accountId
        required: true
        schema:
          description: Agent account identifier; device-claude and device-codex are
            this computer's own logins.
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAgentAccountLoginResponse'
          description: Accepted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Conflict
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Sign a saved account in again, in its own folder
      tags:
      - agents
  /api/v1/agents/accounts/{accountId}/reset-credit:
    post:
      operationId: consumeAgentAccountResetCredit
      parameters:
      - description: Agent account identifier; device-claude and device-codex are
          this computer's own logins.
        in: path
        name: accountId
        required: true
        schema:
          description: Agent account identifier; device-claude and device-codex are
            this computer's own logins.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeAgentAccountResetCreditRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumeAgentAccountResetCreditResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Spend one Codex usage-limit reset of an account
      tags:
      - agents
  /api/v1/agents/accounts/login:
    post:
      operationId: startAgentAccountLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAgentAccountLoginRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAgentAccountLoginResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Add an account by running the provider's own sign-in in a terminal
      tags:
      - agents
  /api/v1/agents/accounts/login/{operationId}/cancel:
    post:
      operationId: cancelAgentAccountLogin
      parameters:
      - description: Agent account sign-in operation identifier.
        in: path
        name: operationId
        required: true
        schema:
          description: Agent account sign-in operation identifier.
          type: string
      responses:
        "204":
          description: No Content
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Stop a sign-in and remove its unsaved folder
      tags:
      - agents
  /api/v1/agents/accounts/login/{operationId}/verify:
    post:
      operationId: verifyAgentAccountLogin
      parameters:
      - description: Agent account sign-in operation identifier.
        in: path
        name: operationId
        required: true
        schema:
          description: Agent account sign-in operation identifier.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyAgentAccountLoginResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Check a sign-in and save the account when it finished
      tags:
      - agents
  /api/v1/agents/accounts/sessions/{sessionId}:
    get:
      operationId: getSessionAgentAccounts
      parameters:
      - description: AO session identifier.
        in: path
        name: sessionId
        required: true
        schema:
          description: AO session identifier.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAgentAccountsResponse'
          description: OK
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Read the account a session uses per provider
      tags:
      - agents
    put:
      operationId: switchSessionAgentAccount
      parameters:
      - description: AO session identifier.
        in: path
        name: sessionId
        required: true
        schema:
          description: AO session identifier.
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchSessionAgentAccountRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSessionInterfaceTransitionResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Conflict
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Start moving a session to another account through the durable controller
        handoff
      tags:
      - agents
  /api/v1/agents/accounts/usage:
    get:
      operationId: getAgentAccountUsage
      parameters:
      - description: Days of usage to sum, today included. Defaults to 30.
        in: query
        name: days
        schema:
          description: Days of usage to sum, today included. Defaults to 30.
          maximum: 90
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAccountUsageResponse'
          description: OK
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Sum each account's model usage in AO sessions
      tags:
      - agents
  /api/v1/agents/auth-plans:
    get:
      operationId: listAgentAuthPlans
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentAuthPlansResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Return display-safe native authentication plans for supported agents
      tags:
      - agents
  /api/v1/agents/codex/account-switches:
    post:
      operationId: startCodexAccountSwitch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCodexAccountSwitchRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexAccountSwitchResponse'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Service Unavailable
      summary: Start a global AO Codex account switch
      tags:
      - agents
  /api/v1/agents/codex/account-switches/{switchId}:
    get:
      operationId: getCodexAccountSwitch
      parameters:
      - description: Durable Codex account switch identifier.
        in: path
        name: switchId
        required: true
        schema:
          description: Durable Codex account switch identifier.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexAccountSwitchResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Service Unavailable
      summary: Read one durable Codex account switch
      tags:
      - agents
  /api/v1/agents/codex/accounts:
    get:
      operationId: getCodexAccounts
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexAccountsResponse'
          description: OK
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Service Unavailable
      summary: Return cached AO Codex accounts and active-account state
