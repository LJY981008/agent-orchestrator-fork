            apply to the execution; verifying: LADO could not compute the item yet;
            worktree_changed: the worktree changed since LADO''s last check command
            on the head; head_unavailable: the head is not in the local repository
            and LADO could not fetch it; base_deleted: the local base branch that
            existed at dispatch is gone.'
          enum:
          - not_required
          - verifying
          - checks_pending
          - checks_failed
          - none_reported
          - commands_running
          - worktree_not_at_head
          - worktree_changed
